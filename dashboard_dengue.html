<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dengue - Argentina Hub</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  body { background: #0a0a0f; color: #e8e8f0; font-family: monospace; padding: 20px; }
  .container { max-width: 800px; margin: 0 auto; }
  h1 { color: #e8ff47; }
  .chart-box { background: #111118; border: 1px solid #1e1e2e; border-radius: 12px; padding: 20px; margin: 20px 0; }
  canvas { max-height: 300px; }
</style>
</head>
<body>
<div class="container">
  <h1>🦟 Dengue en Argentina</h1>
  <p>77,852 registros · DuckDB · Sin cloud</p>

  <div class="chart-box">
    <h3>Top 5 provincias</h3>
    <canvas id="chartProvincias"></canvas>
  </div>

  <div class="chart-box">
    <h3 id="tituloAnual">Casos anuales — Nacional</h3>
    <canvas id="chartAnual"></canvas>
  </div>

  <div class="chart-box">
    <h3 id="tituloFormosa">Formosa por departamento</h3>
    <canvas id="chartFormosa"></canvas>
  </div>
</div>

<script>
fetch("data_dengue.json")
  .then(r => r.json())
  .then(data => {
    document.getElementById("tituloAnual").textContent = `Casos anuales — Nacional (${data.rango_anios})`;
    document.getElementById("tituloFormosa").textContent = `Formosa por departamento (${data.rango_formosa})`;

    new Chart(document.getElementById("chartProvincias"), {
      type: "bar",
      data: {
        labels: data.provincias.map(d => d.provincia_residencia),
        datasets: [{ label: "Casos totales", data: data.provincias.map(d => d.total), backgroundColor: "#e8ff47" }]
      },
      options: { plugins: { legend: { labels: { color: "#e8e8f0" } } }, scales: { x: { ticks: { color: "#6a6a8a" } }, y: { ticks: { color: "#6a6a8a" } } } }
    });

    new Chart(document.getElementById("chartAnual"), {
      type: "line",
      data: {
        labels: data.anual_nacional.map(d => d.anio_min),
        datasets: [{ label: "Casos por año", data: data.anual_nacional.map(d => d.total), borderColor: "#e8ff47", fill: false }]
      },
      options: { plugins: { legend: { labels: { color: "#e8e8f0" } } }, scales: { x: { ticks: { color: "#6a6a8a" } }, y: { ticks: { color: "#6a6a8a" } } } }
    });

    new Chart(document.getElementById("chartFormosa"), {
      type: "bar",
      data: {
        labels: data.formosa.map(d => d.departamento_residencia),
        datasets: [{ label: "Casos en Formosa", data: data.formosa.map(d => d.total), backgroundColor: "#2aff8f" }]
      },
      options: { plugins: { legend: { labels: { color: "#e8e8f0" } } }, scales: { x: { ticks: { color: "#6a6a8a" } }, y: { ticks: { color: "#6a6a8a" } } } }
    });
  });
</script>
</body>
</html>
